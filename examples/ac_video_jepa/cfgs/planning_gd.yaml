# Gradient Descent planning config
# Same env setup as CEM/MPPI: env_n_allowed_steps=200, plan_length=90, num_act_stepped=1
logging:
  tqdm_silent: false
task_specification:
  goal_source: random_state
  obs: rgb
planner:
  planner_name: gd
  num_act_stepped: 1
  plan_length: 90
  n_iters: 50
  lr: 0.1
  optimizer_type: adam
  max_norms:
    - 2.45
  max_norm_dims:
    - 0
    - 1
  decode_each_iteration: false
  planning_objective:
    objective_type: repr_dist
    sum_all_diffs: true
    alpha: 0.
ctxt_window_time: 1
